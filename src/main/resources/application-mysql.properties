# ==============================================================================
# MySQL 8.x Production/College Demo Profile
# ==============================================================================

# Database Connection
# Connects to MySQL on localhost:3306. Automatically creates buswise_db if it does not exist.
spring.datasource.url=jdbc:mysql://localhost:3306/buswise_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.example.buswise=INFO
logging.level.org.hibernate.SQL=WARN
