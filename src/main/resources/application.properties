# ==============================================================================
# BusWise - Intelligent Bus Transport Management System
# Main Application Configuration
# ==============================================================================

spring.application.name=buswise
server.port=8080

# Active Profile:
# - 'dev': Uses persistent local H2 storage with MySQL mode for instant out-of-the-box running
# - 'mysql': Connects directly to local MySQL 8.x server (localhost:3306/buswise_db)
spring.profiles.active=dev

# Common Jackson JSON Formatter Settings
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.serialization.write-dates-as-timestamps=false

# Static Resource Handling (Frontend served from /static)
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.chain.cache=false

# File Upload / Request Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
