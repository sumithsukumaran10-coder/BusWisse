# ==============================================================================
# Development Profile (Fast, Zero-Setup, Persistent Local H2 Database)
# ==============================================================================

# Database Connection (Zero-setup in-memory database with MySQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:buswisedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console for interactive database inspection at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Logging
logging.level.com.example.buswise=INFO
logging.level.org.hibernate.SQL=WARN
